name: Sync Backend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configurer l'identité Git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 2. Isoler le contenu du dossier backend dans une nouvelle branche locale 'deploy'
          git subtree split --prefix backend -b deploy
          
          # 3. Pousser CETTE branche de force vers le main de Hugging Face
          git push --force https://NS78:${HF_TOKEN}@huggingface.co/spaces/NS78/heart-disease-api deploy:main