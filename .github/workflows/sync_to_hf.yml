name: Sync Backend to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - 'backend/**' # Ne se déclenche que lorsque le back est modifié

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configurer l'identité Git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 2. Extraire le dossier backend vers une branche temporaire et l'envoyer sur HF
          git subtree push --prefix backend https://NS78:$HF_TOKEN@huggingface.co/spaces/NS78/heart-disease-api main

